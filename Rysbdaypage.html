	.container1{

	.flip-card{
  		background-color: transparent;
		width: 300px;
		height: 300px;
		perspective: 1000px;
		margin-top: 100px;
		margin-left: 350px; 
	}

	.flip-card-inner{
		position: relative;
		width: 100%;
		height: 100%;
		text-align: center;
		transition: transform 0.8s;
		transform-style: preserve-3d;
	}

	.flip-card:hover .flip-card-inner{
		transform: rotateY(180deg);
	}

	.card-front, .card-back{
		position: absolute;
		width: 100%;
		height: 100%;
		-webkit-backface-visibility: hidden; 
		backface-visibility: hidden;
	}

	.card-front{
		background-color: #bbb;
		color: black;
	}

	.card-back{
		background-image: url("Cont4.jpg");
		background-size: 300px 300px;
		color: white;
		transform: rotateY(180deg);
	}

	.card-back h3{
		color: black;
		padding-top: 10px;
	}

	.card-back p1{
		color: black;
		font-size: 20px;
	}

	.container2{
		background-color: black;
		height: 1000px;
		width: 800px;
		margin-top: 100px;
		margin-left: 100px;
	}
</style>
